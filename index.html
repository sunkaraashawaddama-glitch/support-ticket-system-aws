<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Support Tickets</title>
<style>
body{font-family:Arial;max-width:600px;margin:40px auto;padding:20px;background:#f4f4f4}
h1{text-align:center}form{background:white;padding:20px;border-radius:8px}
input,textarea,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px;box-sizing:border-box}
button{background:#ff9900;color:white;padding:12px;border:none;border-radius:4px;width:100%;cursor:pointer;font-size:16px}
#result{margin-top:15px;padding:10px;display:none}.success{background:#d4edda}.error{background:#f8d7da}
.ticket{background:white;padding:10px;margin:8px 0;border-radius:6px;border-left:4px solid #ff9900}
</style>
</head>
<body>
<h1>Support Ticket System</h1>
<form id="ticketForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<input type="text" id="subject" placeholder="Subject" required>
<textarea id="description" placeholder="Describe your issue..." rows="4" required></textarea>
<select id="priority"><option value="LOW">LOW</option><option value="MEDIUM" selected>MEDIUM</option><option value="HIGH">HIGH</option></select>
<button type="submit">Submit Ticket</button>
</form>
<div id="result"></div>
<hr>
<h2>View Tickets</h2>
<button onclick="loadTickets()" style="background:#232f3e">View All Tickets</button>
<div id="ticketList" style="margin-top:15px"></div>
<script>
const API_URL="https://8q6lbz30y9.execute-api.ap-south-1.amazonaws.com/prod/tickets";
document.getElementById('ticketForm').addEventListener('submit',async(e)=>{
e.preventDefault();const r=document.getElementById('result');
const data={name:document.getElementById('name').value,email:document.getElementById('email').value,subject:document.getElementById('subject').value,description:document.getElementById('description').value,priority:document.getElementById('priority').value};
try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await res.json();r.style.display='block';if(res.ok){r.className='success';r.innerHTML='Ticket Created! ID: '+out.ticketId;document.getElementById('ticketForm').reset();}else{r.className='error';r.innerHTML='Error: '+JSON.stringify(out);}}catch(err){r.style.display='block';r.className='error';r.innerHTML='Error: '+err.message;}});
async function loadTickets(){
const listDiv=document.getElementById('ticketList');
listDiv.innerHTML='Loading...';
try{
const res=await fetch(API_URL);
const tickets=await res.json();
if(tickets.length===0){listDiv.innerHTML='No tickets yet.';return;}
let html='';
tickets.forEach(t=>{
html+='<div class="ticket"><b>'+t.ticketId+'</b> - '+t.subject+'<br>'+t.name+' | '+t.priority+' | <b>'+t.status+'</b><br><small>'+t.createdAt+'</small></div>';
});
listDiv.innerHTML=html;
}catch(e){listDiv.innerHTML='Error: '+e.message;}
}
</script>
</body>
</html>
